<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Drop Game - GeoRose (Starting Soon Overlay)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Fully transparent — sits on top of the Starting Soon scene in OBS */
        html, body {
            background: transparent;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>

    <!-- TMI.js for Twitch chat integration (keep tmi.min.js next to this file) -->
    <script src="tmi.min.js"></script>
    <script>
    (() => {
        // =====================================================================
        // CONFIGURATION
        // =====================================================================
        const CHANNEL = 'georose';     // https://www.twitch.tv/georose
        const CANVAS_W = 1920;
        const CANVAS_H = 1080;

        // Round length — game auto-resets this long after the first !drop
        const ROUND_DURATION_MS = 5 * 60 * 1000; // 5 minutes

        // =====================================================================
        // LANDING PAD (coffin lid)
        // =====================================================================
        // landing-pad.png is exported as a full 1920x1080 frame with the coffin
        // already in position, so it's drawn at 0,0 full size.
        const PAD_DRAW = { x: 0, y: 0, w: 1920, h: 1080 };

        // Coffin lid hit zone, measured from the artwork (pixels).
        // Lid spans x 507–1408, y 838–1040.
        const PAD = { x: 507, y: 838, w: 901, h: 202 };

        // Players stand on this line — the middle of the lid's surface.
        const LANDING_Y = 935;

        // Where players who MISS the lid come to rest (y in pixels).
        const MISS_FLOOR_Y = LANDING_Y;

        // =====================================================================
        // ARTWORK — file paths
        // =====================================================================
        // dropping.png — everyone while falling (plain !drop)
        // landed.png   — whoever is currently closest to the centre
        // missed.png   — everyone else once landed (missed the lid, or on the
        //                lid but not the closest)
        // balloon.png  — floats above and behind an emote while it falls
        const IMAGES = {
            pad:      'images/landing-pad.png',
            dropping: 'images/dropping.png',
            landed:   'images/landed.png',
            missed:   'images/missed.png',
            balloon:  'images/balloon.png',
        };

        // Player sprite widths; height follows each PNG's own proportions
        // so nothing gets stretched.
        const SPRITE_WIDTH = 100;           // dropping.png
        const LANDED_SPRITE_WIDTH = 150;    // landed.png (closest to centre)
        const MISSED_SPRITE_WIDTH = 120;    // missed.png

        // Emotes (!drop <emote>) are drawn in a square this size — always,
        // falling and landed
        const EMOTE_SIZE = 100;

        // Balloon above the emote
        const BALLOON_WIDTH = 100;
        const BALLOON_OVERLAP = 20;     // how far the emote overlaps the bottom of the balloon

        // Collision/physics box for a falling player (pixels)
        const DROP_W = 100;
        const DROP_H = 125;
        const CHAR_RADIUS = Math.max(DROP_W, DROP_H) / 2;

        // Username label
        const NAME_FONT = '12px "Press Start 2P", monospace';
        const NAME_COLOR = '#e0d0ff';
        const NAME_OUTLINE = 'rgba(0, 0, 0, 0.85)';
        const NAME_GAP = 10;            // gap between top of sprite/balloon and name

        // Score label (above the name, lid landings only)
        const SCORE_FONT = '16px "Press Start 2P", monospace';
        const SCORE_FONT_WINNER = '20px "Press Start 2P", monospace';
        const SCORE_COLOR = '#e0d0ff';
        const SCORE_COLOR_WINNER = '#ffd34d';
        const SCORE_GAP = 8;            // gap between name and score

        // =====================================================================
        // ALIGNMENT / TEST HELPERS (leave off for stream)
        // =====================================================================
        const DEBUG_SHOW_HITBOX = false;
        const ALIGN_PREVIEW_IMAGE = null;   // e.g. 'images/starting-soon.png'
        const DEMO_MODE = false;            // browser demo: dark backdrop, controls, autoplay

        // =====================================================================
        // PHYSICS (unchanged from v1.0.0 tuning)
        // =====================================================================
        const GRAVITY = 0.001;
        const HORIZONTAL_SPEED_MIN = 4.0;
        const HORIZONTAL_SPEED_MAX = 8.0;
        const BOUNCE_DAMPING = 0.9;
        const COLLISION_DAMPING = 0.9;
        const MAX_FALL_SPEED = 1.8;

        const FREEFALL_SPEED = 8.0;
        const PARACHUTE_DEPLOY_Y = 0.20;
        const PARACHUTE_TRANSITION_FRAMES = 15;

        function getLandingY() { return LANDING_Y; }
        function getPadCenter() { return PAD.x + PAD.w / 2; }

        // =====================================================================
        // PLACEHOLDER ART — used for any PNG that's missing or still loading
        // =====================================================================
        function makeCanvas(w, h, paint) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            paint(c.getContext('2d'), w, h);
            return c;
        }

        function paintFigure(g, w, h, body, opts = {}) {
            const cx = w / 2;
            if (opts.chute) {
                g.fillStyle = '#7b5cc4';
                g.beginPath();
                g.ellipse(cx, 34, 46, 30, 0, Math.PI, 0);
                g.fill();
                g.strokeStyle = '#2b1d4a';
                g.lineWidth = 2;
                g.stroke();
                g.beginPath();
                g.moveTo(cx - 44, 34); g.lineTo(cx - 8, 78);
                g.moveTo(cx + 44, 34); g.lineTo(cx + 8, 78);
                g.moveTo(cx, 34); g.lineTo(cx, 78);
                g.stroke();
            }
            const headY = opts.chute ? 82 : 52;
            g.fillStyle = body;
            g.strokeStyle = '#1a1030';
            g.lineWidth = 3;
            g.beginPath(); g.arc(cx, headY, 13, 0, Math.PI * 2); g.fill(); g.stroke();
            g.beginPath();
            g.roundRect(cx - 14, headY + 14, 28, opts.chute ? 26 : 50, 6);
            g.fill(); g.stroke();
            if (opts.crown) {
                g.fillStyle = '#ffd34d';
                g.beginPath();
                g.moveTo(cx - 14, headY - 12);
                g.lineTo(cx - 14, headY - 26); g.lineTo(cx - 6, headY - 18);
                g.lineTo(cx, headY - 30); g.lineTo(cx + 6, headY - 18);
                g.lineTo(cx + 14, headY - 26); g.lineTo(cx + 14, headY - 12);
                g.closePath(); g.fill(); g.stroke();
            }
        }

        const PLACEHOLDER = {
            dropping: makeCanvas(100, 125, (g, w, h) => paintFigure(g, w, h, '#c9b8f0', { chute: true })),
            landed:   makeCanvas(100, 125, (g, w, h) => paintFigure(g, w, h, '#ffd34d', { crown: true })),
            missed:   makeCanvas(100, 125, (g, w, h) => paintFigure(g, w, h, '#6d6680')),
            balloon:  makeCanvas(100, 130, (g, w, h) => {
                g.fillStyle = '#e0457b';
                g.strokeStyle = '#4a1027';
                g.lineWidth = 3;
                g.beginPath(); g.ellipse(50, 50, 38, 46, 0, 0, Math.PI * 2); g.fill(); g.stroke();
                g.fillStyle = 'rgba(255,255,255,0.45)';
                g.beginPath(); g.ellipse(36, 32, 8, 14, -0.4, 0, Math.PI * 2); g.fill();
                g.beginPath();
                g.moveTo(50, 96); g.lineTo(44, 104); g.lineTo(56, 104); g.closePath();
                g.fillStyle = '#e0457b'; g.fill(); g.stroke();
                g.beginPath(); g.moveTo(50, 104); g.quadraticCurveTo(58, 117, 50, 130);
                g.lineWidth = 2; g.stroke();
            }),
        };

        // =====================================================================
        // IMAGE LOADING
        // =====================================================================
        const img = {};
        Object.entries(IMAGES).forEach(([key, src]) => {
            const i = new Image();
            i.onerror = () => console.warn(`Missing image, using placeholder: ${src}`);
            i.src = src;
            img[key] = i;
        });

        let previewImg = null;
        if (ALIGN_PREVIEW_IMAGE) {
            previewImg = new Image();
            previewImg.src = ALIGN_PREVIEW_IMAGE;
        }

        function isReady(i) {
            if (!i) return false;
            if (i instanceof HTMLCanvasElement) return true;
            return i.complete && i.naturalWidth > 0;
        }

        function art(key) {
            return isReady(img[key]) ? img[key] : PLACEHOLDER[key];
        }

        function natural(i) {
            return i instanceof HTMLCanvasElement
                ? { w: i.width, h: i.height }
                : { w: i.naturalWidth, h: i.naturalHeight };
        }

        function sizeAtWidth(i, width) {
            const n = natural(i);
            return { w: width, h: width * (n.h / n.w) };
        }

        // =====================================================================
        // STATE
        // =====================================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Twitch emotes are shown as real <img> elements layered over the
        // canvas, so animated (GIF) emotes play their animation. A canvas
        // can only draw a GIF's first frame.
        const emoteLayer = document.createElement('div');
        emoteLayer.id = 'emoteLayer';
        Object.assign(emoteLayer.style, {
            position: 'absolute', inset: '0', overflow: 'hidden', pointerEvents: 'none',
        });
        canvas.insertAdjacentElement('afterend', emoteLayer);

        function placeEmote(el, left, top, w, h) {
            el.style.left = (left / CANVAS_W * 100) + '%';
            el.style.top = (top / CANVAS_H * 100) + '%';
            el.style.width = (w / CANVAS_W * 100) + '%';
            el.style.height = (h / CANVAS_H * 100) + '%';
            el.style.visibility = 'visible';
        }

        let gameActive = false;
        let players = {};
        let winnerKey = null;
        let resetTimer = null;
        let roundStartedAt = 0;

        // =====================================================================
        // ROUND CONTROL
        // =====================================================================
        // The first !drop starts the round: pad appears, 5-minute timer begins.
        function startRound() {
            emoteLayer.replaceChildren();
            gameActive = true;
            players = {};
            winnerKey = null;
            roundStartedAt = Date.now();
            clearTimeout(resetTimer);
            resetTimer = setTimeout(resetRound, ROUND_DURATION_MS);
        }

        // Pad and players vanish; overlay is fully transparent again.
        function resetRound() {
            emoteLayer.replaceChildren();
            gameActive = false;
            players = {};
            winnerKey = null;
            clearTimeout(resetTimer);
            resetTimer = null;
        }

        // emote: null for the standard artwork, or
        //   { kind: 'image', src }    — Twitch emote image URL
        //   { kind: 'emoji', text }   — a unicode emoji
        //   { kind: 'canvas', canvas } — test shapes
        function handleDrop(username, emote = null, login = null) {
            if (!gameActive) startRound();
            // One drop per person per game, keyed on their Twitch login so a
            // repeat !drop (or a different emote, or a display-name change)
            // is ignored until the round resets.
            const userKey = (login || username).toLowerCase();
            if (players[userKey]) return;
            players[userKey] = createPlayer(username, userKey, prepareEmote(emote));
        }

        function prepareEmote(emote) {
            if (!emote) return null;
            if (emote.kind === 'image') {
                const i = new Image();
                i.alt = '';
                i.style.position = 'absolute';
                i.style.visibility = 'hidden';   // shown once positioned
                const e = { kind: 'image', img: i, failed: false };
                i.onerror = () => { e.failed = true; i.remove(); };
                i.src = emote.src;
                emoteLayer.appendChild(i);
                return e;
            }
            return emote;
        }

        // =====================================================================
        // PLAYER FACTORY
        // =====================================================================
        function createPlayer(username, key, emote) {
            const spawnX = Math.random() * (CANVAS_W - DROP_W) + DROP_W / 2;
            const hSpeed = Math.random() * (HORIZONTAL_SPEED_MAX - HORIZONTAL_SPEED_MIN) + HORIZONTAL_SPEED_MIN;

            const freefallAngle = Math.random() * Math.PI * 2;
            const freefallVx = Math.cos(freefallAngle) * FREEFALL_SPEED;
            const freefallVy = Math.abs(Math.sin(freefallAngle) * FREEFALL_SPEED) + 2;
            const freefallDir = freefallVx >= 0 ? 1 : -1;

            return {
                key: key,
                username: username,
                emote: emote,
                x: spawnX,
                y: -DROP_H - 140,       // start above screen (room for a balloon), already moving
                vx: freefallVx,
                vy: freefallVy,
                radius: CHAR_RADIUS,
                landed: false,
                hit: false,             // landed on the lid
                distFromCenter: Infinity,
                landedOrder: 0,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.15,
                phase: 'freefall',      // 'freefall' | 'deploying' | 'parachute'
                transitionTimer: 0,
                freefallVxAtDeploy: 0,
                freefallVyAtDeploy: 0,
                targetParachuteVx: hSpeed * freefallDir,
                targetParachuteVy: 0.5 + Math.random() * 1.0,
            };
        }

        // =====================================================================
        // PHYSICS
        // =====================================================================
        let landedCounter = 0;

        function keepInBounds(p, damp) {
            if (p.x - DROP_W / 2 <= 0) {
                p.x = DROP_W / 2;
                p.vx = Math.abs(p.vx) * damp;
                if (damp !== 1) p.vx += (Math.random() - 0.3) * 1.5;
            }
            if (p.x + DROP_W / 2 >= CANVAS_W) {
                p.x = CANVAS_W - DROP_W / 2;
                p.vx = -Math.abs(p.vx) * damp;
                if (damp !== 1) p.vx -= (Math.random() - 0.3) * 1.5;
            }
        }

        function updatePlayer(p) {
            if (p.landed) return;

            const deployLineY = CANVAS_H * PARACHUTE_DEPLOY_Y;

            // ── PHASE: FREEFALL ──────────────────────────────────────────
            if (p.phase === 'freefall') {
                p.x += p.vx;
                p.y += p.vy;
                keepInBounds(p, 1);
                p.rotation += p.rotationSpeed * 3;

                if (p.y >= deployLineY) {
                    p.phase = 'deploying';
                    p.transitionTimer = PARACHUTE_TRANSITION_FRAMES;
                    p.freefallVxAtDeploy = p.vx;
                    p.freefallVyAtDeploy = p.vy;
                }
                return;
            }

            // ── PHASE: DEPLOYING (sharp chute pop) ───────────────────────
            if (p.phase === 'deploying') {
                p.transitionTimer--;
                const progress = 1 - (p.transitionTimer / PARACHUTE_TRANSITION_FRAMES);
                const ease = 1 - Math.pow(1 - progress, 6);

                p.vx = p.freefallVxAtDeploy + (p.targetParachuteVx - p.freefallVxAtDeploy) * ease;
                p.vy = p.freefallVyAtDeploy + (p.targetParachuteVy - p.freefallVyAtDeploy) * ease;
                if (p.vy < 0.2) p.vy = 0.2; // never suspend

                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed * (1 - ease) * 3;
                keepInBounds(p, 1);

                if (p.transitionTimer <= 0) {
                    p.phase = 'parachute';
                    p.vx = p.targetParachuteVx;
                    p.vy = p.targetParachuteVy;
                }
                return;
            }

            // ── PHASE: PARACHUTE (gentle drift) ──────────────────────────
            p.vy += GRAVITY;
            if (p.vy < 0) p.vy = 0;
            if (p.vy > MAX_FALL_SPEED) p.vy = MAX_FALL_SPEED;

            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            keepInBounds(p, BOUNCE_DAMPING);

            // ── LANDING ──────────────────────────────────────────────────
            const overPad = p.x >= PAD.x && p.x <= PAD.x + PAD.w;
            const restY = overPad ? getLandingY() : MISS_FLOOR_Y;

            if (p.y + DROP_H / 2 >= restY) {
                p.y = restY - DROP_H / 2;
                p.vx = 0;
                p.vy = 0;
                p.landed = true;
                p.landedOrder = ++landedCounter;
                p.hit = overPad;
                p.distFromCenter = overPad ? Math.abs(p.x - getPadCenter()) : Infinity;
                // Score: 100 dead centre → 0 at the lid's tips, in 0.1 steps.
                // Off the lid = no score.
                if (overPad) {
                    const ratio = Math.max(0, 1 - p.distFromCenter / (PAD.w / 2));
                    p.score = Math.round(ratio * 1000) / 10;
                } else {
                    p.score = null;
                }
                updateWinner();
            }
        }

        // Closest-to-centre lid landing gets landed.png (live — passes along
        // if someone lands closer). Ties go to whoever landed first.
        function updateWinner() {
            let best = null;
            Object.values(players).forEach(p => {
                if (!p.landed || !p.hit) return;
                if (!best ||
                    p.distFromCenter < best.distFromCenter ||
                    (p.distFromCenter === best.distFromCenter && p.landedOrder < best.landedOrder)) {
                    best = p;
                }
            });
            winnerKey = best ? best.key : null;
        }

        // Player-to-player collisions (horizontal only — parachute phase only)
        function handleCollisions() {
            const list = Object.values(players).filter(p => !p.landed && p.phase === 'parachute');

            for (let i = 0; i < list.length; i++) {
                for (let j = i + 1; j < list.length; j++) {
                    const a = list[i];
                    const b = list[j];

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = a.radius + b.radius;

                    if (dist < minDist && dist > 0) {
                        const sign = dx >= 0 ? 1 : -1;
                        const pushStrength = COLLISION_DAMPING * (minDist - dist);

                        a.vx -= sign * pushStrength;
                        b.vx += sign * pushStrength;
                        a.vx += (Math.random() - 0.5) * 1.2;
                        b.vx += (Math.random() - 0.5) * 1.2;

                        const overlap = minDist - dist;
                        a.x -= (overlap / 2) * sign;
                        b.x += (overlap / 2) * sign;

                        a.vy = Math.min(Math.max(0, a.vy), MAX_FALL_SPEED);
                        b.vy = Math.min(Math.max(0, b.vy), MAX_FALL_SPEED);

                        a.rotationSpeed += (Math.random() - 0.5) * 0.1;
                        b.rotationSpeed += (Math.random() - 0.5) * 0.1;
                    }
                }
            }
        }

        // =====================================================================
        // RENDERING
        // =====================================================================
        function draw() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            if (previewImg && isReady(previewImg)) {
                ctx.drawImage(previewImg, 0, 0, CANVAS_W, CANVAS_H);
            }

            if (gameActive) {
                drawPad();

                const all = Object.values(players);
                all.filter(p => p.landed && p.key !== winnerKey).forEach(drawPlayer);
                if (winnerKey && players[winnerKey]) drawPlayer(players[winnerKey]);
                all.filter(p => !p.landed).forEach(drawPlayer);
            }

            if (DEBUG_SHOW_HITBOX) drawDebug();
        }

        function drawPad() {
            if (isReady(img.pad)) {
                ctx.drawImage(img.pad, PAD_DRAW.x, PAD_DRAW.y, PAD_DRAW.w, PAD_DRAW.h);
            }
        }

        function hasUsableEmote(p) {
            const e = p.emote;
            if (!e) return false;
            if (e.kind === 'image') return !e.failed; // still loading → keep slot
            return true;
        }

        function drawEmote(e, x, bottomY) {
            const left = x - EMOTE_SIZE / 2;
            const top = bottomY - EMOTE_SIZE;
            if (e.kind === 'image') {
                if (isReady(e.img)) {
                    // Fit inside the square, keeping the emote's proportions
                    const n = natural(e.img);
                    const s = Math.min(EMOTE_SIZE / n.w, EMOTE_SIZE / n.h);
                    const w = n.w * s, h = n.h * s;
                    placeEmote(e.img, x - w / 2, bottomY - h, w, h);
                }
            } else if (e.kind === 'emoji') {
                ctx.save();
                ctx.font = `${Math.round(EMOTE_SIZE * 0.85)}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(e.text, x, top + EMOTE_SIZE / 2);
                ctx.restore();
            } else if (e.kind === 'canvas') {
                ctx.drawImage(e.canvas, left, top, EMOTE_SIZE, EMOTE_SIZE);
            }
            return top;
        }

        function drawPlayer(p) {
            const footY = p.y + DROP_H / 2;   // every sprite stands on this line
            let topY;

            if (hasUsableEmote(p)) {
                const emoteTop = drawEmoteWithBalloon(p, footY);
                topY = emoteTop;
            } else {
                const key = !p.landed ? 'dropping' : (p.key === winnerKey ? 'landed' : 'missed');
                const sprite = art(key);
                const width = key === 'landed' ? LANDED_SPRITE_WIDTH
                    : key === 'missed' ? MISSED_SPRITE_WIDTH : SPRITE_WIDTH;
                const d = sizeAtWidth(sprite, width);
                topY = footY - d.h;
                ctx.drawImage(sprite, p.x - d.w / 2, topY, d.w, d.h);
            }

            // Username above the sprite / balloon
            ctx.save();
            ctx.font = NAME_FONT;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = NAME_OUTLINE;
            const nameY = topY - NAME_GAP;
            ctx.strokeText(p.username, p.x, nameY);
            ctx.fillStyle = NAME_COLOR;
            ctx.fillText(p.username, p.x, nameY);

            // Score above the name (lid landings only)
            if (p.landed && p.score !== null) {
                const isWinner = p.key === winnerKey;
                ctx.font = isWinner ? SCORE_FONT_WINNER : SCORE_FONT;
                ctx.lineWidth = 5;
                ctx.strokeStyle = NAME_OUTLINE;
                const scoreText = p.score.toFixed(1);
                const scoreY = nameY - 12 - SCORE_GAP;
                ctx.strokeText(scoreText, p.x, scoreY);
                ctx.fillStyle = isWinner ? SCORE_COLOR_WINNER : SCORE_COLOR;
                ctx.fillText(scoreText, p.x, scoreY);
            }
            ctx.restore();
        }

        // Balloon first (behind), then the emote on top. Balloon pops on landing.
        function drawEmoteWithBalloon(p, footY) {
            const emoteTop = footY - EMOTE_SIZE;
            let top = emoteTop;

            if (!p.landed) {
                const balloon = art('balloon');
                const b = sizeAtWidth(balloon, BALLOON_WIDTH);
                const bTop = emoteTop + BALLOON_OVERLAP - b.h;
                ctx.drawImage(balloon, p.x - b.w / 2, bTop, b.w, b.h);
                top = bTop;
            }

            drawEmote(p.emote, p.x, footY);
            return top;
        }

        function drawDebug() {
            ctx.save();
            ctx.strokeStyle = '#50fa7b';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.strokeRect(PAD.x, PAD.y, PAD.w, PAD.h);

            ctx.strokeStyle = '#ff79c6';
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(PAD.x, getLandingY());
            ctx.lineTo(PAD.x + PAD.w, getLandingY());
            ctx.stroke();

            ctx.strokeStyle = '#f1fa8c';
            ctx.beginPath();
            ctx.moveTo(getPadCenter(), PAD.y - 20);
            ctx.lineTo(getPadCenter(), PAD.y + PAD.h);
            ctx.stroke();
            ctx.restore();
        }

        // =====================================================================
        // GAME LOOP
        // =====================================================================
        function gameLoop() {
            if (gameActive) {
                Object.values(players).forEach(updatePlayer);
                handleCollisions();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // =====================================================================
        // CHAT PARSING — !drop  /  !drop <emote or emoji>
        // =====================================================================
        // Twitch emotes (global, sub, channel, follower) arrive in tags.emotes
        // with their character positions, so we can turn them into images.
        // Third-party emotes (BTTV / 7TV / FFZ) are just text to Twitch, so a
        // !drop with one of those falls back to the standard artwork.
        const TWITCH_EMOTE_URL = id => `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/3.0`;
        const EMOJI_RE = /\p{Extended_Pictographic}|\p{Regional_Indicator}/u;

        function firstEmoji(text) {
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                for (const { segment } of new Intl.Segmenter('en', { granularity: 'grapheme' }).segment(text)) {
                    if (EMOJI_RE.test(segment)) return segment;
                }
                return null;
            }
            const m = text.match(EMOJI_RE);
            return m ? m[0] : null;
        }

        function parseDropEmote(message, tags) {
            // Twitch emote: pick the first one that appears after "!drop"
            if (tags.emotes) {
                let best = null;
                Object.entries(tags.emotes).forEach(([id, ranges]) => {
                    ranges.forEach(r => {
                        const start = parseInt(r.split('-')[0], 10);
                        if (start >= 5 && (!best || start < best.start)) best = { id, start };
                    });
                });
                if (best) return { kind: 'image', src: TWITCH_EMOTE_URL(best.id) };
            }
            // Unicode emoji
            const rest = message.slice(5);
            const emoji = firstEmoji(rest);
            if (emoji) return { kind: 'emoji', text: emoji };
            return null;
        }

        function isDropCommand(message) {
            const lower = message.toLowerCase();
            return lower === '!drop' || lower.startsWith('!drop ');
        }

        // =====================================================================
        // TWITCH INTEGRATION
        // =====================================================================
        // !drop          — anyone; standard artwork. First one starts the round
        // !drop <emote>  — anyone; their emote under a balloon
        // !cleardrop     — mods/broadcaster; manual early reset
        if (typeof tmi !== 'undefined') {
            // Anonymous read-only connection — no login or token needed to read chat
            const client = new tmi.Client({
                connection: { secure: true, reconnect: true },
                channels: [CHANNEL],
            });

            client.on('connected', () => console.log(`Connected to #${CHANNEL}`));
            client.on('disconnected', reason => console.warn('Disconnected from Twitch:', reason));

            client.connect()
                .catch(err => console.error('TMI connection error:', err));

            client.on('message', (channel, tags, message, self) => {
                if (self) return;
                const msg = message.trim();
                const username = tags['display-name'] || tags.username || 'anon';
                const isBroadcaster = tags.badges?.broadcaster === '1';
                const isMod = tags.mod || isBroadcaster;

                if (msg.toLowerCase() === '!cleardrop' && isMod) {
                    resetRound();
                    return;
                }

                if (isDropCommand(msg)) {
                    handleDrop(username, parseDropEmote(msg, tags), tags.username);
                }
            });
        } else {
            console.warn('tmi.min.js not found — Twitch disabled, keyboard test controls only.');
        }

        // =====================================================================
        // TEST CONTROLS (no on-screen text in the overlay)
        // =====================================================================
        // D = !drop (standard art)   E = !drop with a random test shape
        // F = flood 10 (mixed)       C = reset
        const TEST_NAMES = [
            'GeoRose', 'PixelKnight', 'BatsyFan', 'StreamSniper', 'ChatHero',
            'LootGoblin', 'EmoteKing', 'SubHype', 'ClipChamp', 'RaidBoss',
            'NightOwl', 'CouchPotato', 'DropGod', 'FloorGang', 'TargetPro',
            'LuckyDrop', 'WallBouncer', 'GravityCheck', 'FreeFaller', 'BullsEye',
            'MissedIt', 'CenterStage', 'EdgeLord', 'BounceMaster', 'ChaosAgent',
            'PlotTwist', 'LastPlace', 'TopFrag', 'NoScope', 'EZClap'
        ];
        let testNameIndex = 0;

        const SHAPE_COLOURS = ['#ff5d8f', '#4dd9ff', '#ffd34d', '#7cf29c', '#b48cff', '#ff9a4d'];
        const SHAPES = ['circle', 'square', 'triangle', 'star', 'diamond', 'heart'];

        function randomShapeEmote() {
            const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            const colour = SHAPE_COLOURS[Math.floor(Math.random() * SHAPE_COLOURS.length)];
            const c = makeCanvas(112, 112, (g) => {
                g.fillStyle = colour;
                g.strokeStyle = '#140c24';
                g.lineWidth = 5;
                g.lineJoin = 'round';
                g.beginPath();
                const cx = 56, cy = 56;
                if (shape === 'circle') g.arc(cx, cy, 44, 0, Math.PI * 2);
                if (shape === 'square') g.roundRect(14, 14, 84, 84, 10);
                if (shape === 'triangle') { g.moveTo(cx, 10); g.lineTo(102, 98); g.lineTo(10, 98); g.closePath(); }
                if (shape === 'diamond') { g.moveTo(cx, 8); g.lineTo(104, cy); g.lineTo(cx, 104); g.lineTo(8, cy); g.closePath(); }
                if (shape === 'star') {
                    for (let k = 0; k < 10; k++) {
                        const r = k % 2 === 0 ? 48 : 20;
                        const a = -Math.PI / 2 + k * Math.PI / 5;
                        g[k ? 'lineTo' : 'moveTo'](cx + r * Math.cos(a), cy + r * Math.sin(a));
                    }
                    g.closePath();
                }
                if (shape === 'heart') {
                    g.moveTo(cx, 98);
                    g.bezierCurveTo(-6, 54, 22, -4, cx, 30);
                    g.bezierCurveTo(90, -4, 118, 54, cx, 98);
                    g.closePath();
                }
                g.fill();
                g.stroke();
            });
            return { kind: 'canvas', canvas: c };
        }

        function nextTestName() {
            const name = TEST_NAMES[testNameIndex % TEST_NAMES.length]
                + (testNameIndex >= TEST_NAMES.length ? Math.floor(testNameIndex / TEST_NAMES.length) : '');
            testNameIndex++;
            return name;
        }

        function testDrop() { handleDrop(nextTestName()); }
        // Optional animated test emotes (image URLs), e.g. set by the test bench
        const TEST_ANIMATED_EMOTES = window.TEST_ANIMATED_EMOTES || [];

        function testShapeDrop() {
            if (TEST_ANIMATED_EMOTES.length && Math.random() < 0.5) {
                const src = TEST_ANIMATED_EMOTES[Math.floor(Math.random() * TEST_ANIMATED_EMOTES.length)];
                handleDrop(nextTestName(), { kind: 'image', src });
            } else {
                handleDrop(nextTestName(), randomShapeEmote());
            }
        }
        function testFlood() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => (Math.random() < 0.5 ? testShapeDrop() : testDrop()), i * 120);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target && /input|textarea|button/i.test(e.target.tagName)) return;
            const key = e.key.toLowerCase();
            if (key === 'd') testDrop();
            if (key === 'e') testShapeDrop();
            if (key === 'f') testFlood();
            if (key === 'c') resetRound();
        });

        // Expose controls for the browser demo page
        window.dropGame = { testDrop, testShapeDrop, testFlood, resetRound,
            isActive: () => gameActive, playerCount: () => Object.keys(players).length,
            allLanded: () => Object.values(players).every(p => p.landed),
            roundAge: () => Date.now() - roundStartedAt };

        // =====================================================================
        // INIT
        // =====================================================================
        gameLoop();
    })();
    </script>
</body>
</html>
